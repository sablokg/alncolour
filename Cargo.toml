[package]
name = "alncolour"
version = "0.1.0"
edition = "2024"
readme = "README.md"
license = "MIT"
authors = ["Gaurav Sablok"]
description = "genome alignment visualization"
homepage = "https://codeberg.org/gsablok/alncolour"
repository = "https://codeberg.org/gsablok/alncolour"
keywords = ["bioinformatics","genomics"]


[dependencies]
clap = { version = "4.6.3", features = ["derive"] }
figlet-rs = "0.1.5"
rayon = "1.12.0"
tokio = { version = "1.53.1", features = ["full"] }
